name: cyclezen
description: CycleZen - Your cycling companion. Discover routes, track rides, navigate with voice guidance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.3.0

  # Router
  go_router: ^14.8.1

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Maps & Location
  google_maps_flutter: ^2.10.1
  geolocator: ^13.0.2
  flutter_polyline_points: ^2.1.0

  # Navigation & Voice
  flutter_tts: ^4.2.2

  # UI (system font — Roboto/SF Pro, crisp and hinted)
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  gap: ^3.0.1

  # Storage & Network
  http: ^1.3.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.5
  open_filex: ^4.6.0

  # Utils
  intl: ^0.19.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.3
  package_info_plus: ^8.3.0
  device_info_plus: ^11.3.0

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
